[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h2ageing"
version = "1.0.0"
description = "Effect of PEM electrolyser and PEM fuel cell ageing on the life cycle assessment of a hydrogen mobility chain"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyyaml>=6.0", "openpyxl>=3.1", "matplotlib>=3.7"]

[project.optional-dependencies]
brightway = ["bw2data>=4", "bw2calc>=2"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
